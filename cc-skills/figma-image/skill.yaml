# Skill: figma-image

## 描述场景1: 提供了本地Figma MCP 本地服务器，以及对应的对应的layer link(https://www.figma.com/design/xxxxxxxxxxxxxxxxxxx?node-id=xxxx&m=dev) 或者 layer 名称，并且需要使用的figma上面的图片
- 1. 使用 curl 自动从Figma下载所需图片到临时目录 temps/images 中
- 2. 下载完成之后使用 .claude/skills/upload_to_obs/skill.yaml upload_to_obs 将其上传至华为云OBS上
- 3. 将上传之后返回的连接添加到 src/common/utils/const-value.ts 里面的对象 defaultImgUrl 中，注意按照当前规范添加
- 4. 添加完成之后，如果需要使用，则使用 defaultImgUrl 对象完成图片使用

## 描述场景2: 提供了本地图片目录或者图片
- 1. 使用 .claude/skills/upload_to_obs/skill.yaml upload_to_obs 将其上传至华为云OBS上
- 2. 将上传之后返回的连接添加到 src/common/utils/const-value.ts 里面的对象 defaultImgUrl 中，注意按照当前规范添加
- 3. 添加完成之后，如果需要使用，则使用 defaultImgUrl 对象完成图片使用

## 当出现下面内容的时候必须使用这个skill
- 使用了 Figma MCP 本地服务器 或者 https://www.figma.com/design 生成代码
- 使用了 Figma MCP 本地服务器 或者 https://www.figma.com/design 下载图片
- 使用了 Figma MCP 本地服务器 或者 https://www.figma.com/design 修改代码
- 使用了 Figma MCP 本地服务器 或者 https://www.figma.com/design 修改图片

## 使用 skill upload_to_obs .claude/skills/upload_to_obs/skill.yaml
- 提供上传凭证的时候，使用 skill upload_to_obs
- 上传到华为云 OBS的时候，使用 skill upload_to_obs

## 任务的范围
- Figma下载所需图片到临时目录 temps/images 中
- 使用 skill upload_to_obs，上传到华为云 OBS的
- 添加到 src/common/utils/const-value.ts 里面的对象 defaultImgUrl 中
- 使用 defaultImgUrl 对象完成图片使用

# defaultImgUrl 变量的规则
图片路径前缀使用了 cdnUrlPrefix 变量保持统一
Example:
  export const cdnHost = '//glep-img.golingo.cn'
  export const cdnUrlPrefix = `${cdnHost}/glep-web-lang-edu/lang-edu/images`
  export const defaultImgUrl = {
    submit_error: `${cdnUrlPrefix}/submit_error.png`
  }


# Code Usage Rules

  Generated code must import and use the image constants.

Example:

  import { defaultImgUrl } from '@/common/utils/const-value'

Usage:

  <img src={defaultImgUrl.buttonStart} />
  
  Never hardcode image URLs in JSX/TSX.

---

# CSS Usage Rules

  If the image is used inside CSS styles,
  the direct URL should be used.

Example:

background-image: url("//glep-img.golingo.cn/glep-web-lang-edu/lang-edu/images/banner-course.png");

---

# Workflow

When generating UI code from Figma:

  1. Identify layers requiring image assets
  2. Export images via the Figma MCP server
  3. Upload images to OBS
  4. Register image URLs in `defaultImgUrl`
  5. Use `defaultImgUrl` in generated code

---

# Important Rules

Claude must always:

  - Use `defaultImgUrl` for JSX images
  - Avoid hardcoded URLs in components
  - Keep naming semantic and consistent
  - Keep `const-value.ts` format unchanged
